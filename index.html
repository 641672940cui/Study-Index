<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的学习索引 · 高中学科</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #eef2f7 0%, #f7f9fc 60%, #eef4f0 100%);
            min-height: 100vh;
            color: #1a2332;
            padding: 24px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            padding: 16px 0 28px;
            max-width: 600px;
            width: 100%;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1a2332;
            letter-spacing: 1px;
        }
        .header .sub {
            font-size: 14px;
            color: #6b7a8f;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            max-width: 600px;
            width: 100%;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 24px 18px 20px;
            box-shadow: 0 4px 16px rgba(30, 58, 138, 0.08);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(30, 58, 138, 0.1);
        }
        .card .icon {
            font-size: 40px;
            margin-bottom: 12px;
            line-height: 1;
        }
        .card .name {
            font-size: 18px;
            font-weight: 700;
            color: #1a2332;
            letter-spacing: 1px;
        }
        .card .desc {
            font-size: 12px;
            color: #8b98a8;
            margin-top: 6px;
            text-align: center;
            line-height: 1.4;
        }
        .card .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }
        .badge-live {
            background: #e6f3ea;
            color: #2d7d46;
        }
        .badge-soon {
            background: #f0f2f5;
            color: #9aa8b9;
        }
        .card.locked {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .card.locked:active {
            transform: none;
            box-shadow: 0 4px 16px rgba(30, 58, 138, 0.08);
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #9aa8b9;
            margin-top: 32px;
            line-height: 1.8;
            max-width: 600px;
        }
        @media (min-width: 640px) {
            body { padding: 40px 24px 60px; }
            .header h1 { font-size: 30px; }
            .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 720px; }
            .card { min-height: 180px; padding: 28px 20px 24px; }
            .card .icon { font-size: 48px; }
            .card .name { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 我的学习索引</h1>
        <div class="sub">高中主要学科 · 学习资源导航</div>
    </div>

    <div class="grid">
        <a class="card" href="https://641672940cui.github.io/chemistry/" target="_blank" rel="noopener">
            <span class="badge badge-live">已上线</span>
            <div class="icon">🧪</div>
            <div class="name">化学</div>
            <div class="desc">语言记忆 · 真题演练</div>
        </a>

        <a class="card" href="https://641672940cui.github.io/highschool-math/" target="_blank" rel="noopener">
            <span class="badge badge-live">已上线</span>
            <div class="icon">📐</div>
            <div class="name">数学</div>
            <div class="desc">高中数学 · 学习资源</div>
        </a>

        <a class="card" href="https://641672940cui.github.io/biology/" target="_blank" rel="noopener">
            <span class="badge badge-live">已上线</span>
            <div class="icon">🧬</div>
            <div class="name">生物</div>
            <div class="desc">语言记忆 · 真题演练</div>
        </a>

        <!-- 新增：英语已上线卡片 -->
        <a class="card" href="https://641672940cui.github.io/english/" target="_blank" rel="noopener">
            <span class="badge badge-live">已上线</span>
            <div class="icon">🔤</div>
            <div class="name">英语</div>
            <div class="desc">语言记忆 · 真题演练</div>
        </a>

        <!-- 语文（建设中） -->
        <div class="card locked">
            <span class="badge badge-soon">建设中</span>
            <div class="icon">📖</div>
            <div class="name">语文</div>
            <div class="desc">敬请期待</div>
        </div>

        <!-- 物理（建设中） -->
        <div class="card locked">
            <span class="badge badge-soon">建设中</span>
            <div class="icon">⚛️</div>
            <div class="name">物理</div>
            <div class="desc">敬请期待</div>
        </div>
    </div>

    <div class="footer">
        数据与内容持续更新中<br>
        点击已上线学科进入学习
    </div>

</body>
</html>
